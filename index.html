<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSCP+ Cheat Sheet Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════
   TOKENS
══════════════════════════════ */
:root {
  --bg:       #07090d;
  --bg2:      #0c0f16;
  --panel:    #111520;
  --card:     #161b28;
  --border:   #1e2638;
  --border2:  #2a3550;
  --green:    #00e5a0;
  --green-d:  #00b87e;
  --green-glow: rgba(0,229,160,.14);
  --blue:     #4da6ff;
  --red:      #ff4d6d;
  --yellow:   #ffd166;
  --orange:   #ff8c42;
  --cyan:     #22d3ee;
  --purple:   #c084fc;
  --text:     #dce6f2;
  --tmid:     #7a8fa8;
  --tdim:     #3b4f66;
  --mono:     'JetBrains Mono', monospace;
  --sans:     'IBM Plex Sans', sans-serif;
  --display:  'Bebas Neue', sans-serif;
  --sbw:      260px;
  --r:        8px;
  --rl:       12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; line-height: 1.6; display: flex; min-height: 100vh; overflow-x: hidden; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--green-d); }

/* ══════════════════════════════
   SIDEBAR
══════════════════════════════ */
.sidebar {
  position: fixed; top: 0; left: 0;
  width: var(--sbw); height: 100vh;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  z-index: 200; overflow: hidden;
  transition: transform .25s cubic-bezier(.4,0,.2,1);
}
.sidebar.hidden { transform: translateX(calc(-1 * var(--sbw))); }

/* head */
.sb-head {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-logo {
  font-family: var(--display); font-size: 30px; letter-spacing: 3px;
  color: var(--green); text-shadow: 0 0 22px rgba(0,229,160,.45); line-height: 1;
}
.sb-sub { font-size: 8px; letter-spacing: 2px; color: var(--tdim); margin-top: 2px; text-transform: uppercase; }
.sb-save {
  display: flex; align-items: center; gap: 5px;
  margin-top: 8px; font-size: 9px; color: var(--tdim);
  font-family: var(--mono); letter-spacing: 1px;
}
.save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tdim); transition: all .3s; flex-shrink: 0; }
.save-dot.on { background: var(--green); box-shadow: 0 0 7px var(--green); }

/* vars in sidebar */
.sb-vars {
  padding: 10px 12px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-vars-lbl { font-size: 8px; letter-spacing: 2px; color: var(--tdim); text-transform: uppercase; margin-bottom: 7px; }
.vrow { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
.vrow:last-of-type { margin-bottom: 0; }
.vrow label { font-size: 8px; letter-spacing: 1px; color: var(--blue); font-family: var(--mono); width: 58px; flex-shrink: 0; text-transform: uppercase; }
.vrow input {
  flex: 1; min-width: 0;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 4px; padding: 3px 6px;
  color: var(--green); font-family: var(--mono); font-size: 9px; outline: none;
  transition: border-color .15s;
}
.vrow input:focus { border-color: var(--green); }
.sb-var-btns { display: flex; gap: 4px; margin-top: 8px; }

/* nav */
.sb-nav { flex: 1; overflow-y: auto; padding: 8px 0 10px; }
.sb-nav-lbl { font-size: 8px; letter-spacing: 2px; color: var(--tdim); text-transform: uppercase; padding: 6px 16px 3px; font-weight: 600; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 16px; cursor: pointer; font-size: 11px; color: var(--tmid);
  border-left: 2px solid transparent; transition: all .15s; user-select: none;
}
.nav-item:hover { color: var(--text); background: rgba(255,255,255,.03); border-left-color: var(--border2); }
.nav-item.active { color: var(--green); background: var(--green-glow); border-left-color: var(--green); }
.nav-item .ni-count { margin-left: auto; font-size: 9px; font-family: var(--mono); background: var(--panel); padding: 1px 5px; border-radius: 3px; color: var(--tdim); }
.nav-item .ni-icon { font-size: 13px; flex-shrink: 0; }

/* footer */
.sb-footer { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }

/* ══════════════════════════════
   BUTTONS
══════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 5px 11px; border-radius: var(--r); font-size: 10px;
  font-family: var(--sans); font-weight: 500; letter-spacing: .5px;
  cursor: pointer; transition: all .15s; border: 1px solid var(--border);
  background: var(--panel); color: var(--tmid); text-transform: uppercase; white-space: nowrap;
}
.btn:hover { border-color: var(--tmid); color: var(--text); }
.btn:active { transform: scale(.97); }
.btn-green { border-color: rgba(0,229,160,.4); color: var(--green); background: var(--green-glow); }
.btn-green:hover { background: rgba(0,229,160,.22); border-color: var(--green); }
.btn-blue { border-color: rgba(77,166,255,.3); color: var(--blue); }
.btn-blue:hover { background: rgba(77,166,255,.1); border-color: var(--blue); }
.btn-red { border-color: rgba(255,77,109,.3); color: var(--red); }
.btn-red:hover { background: rgba(255,77,109,.1); border-color: var(--red); }
.btn-yellow { border-color: rgba(255,209,102,.3); color: var(--yellow); }
.btn-yellow:hover { background: rgba(255,209,102,.1); border-color: var(--yellow); }
.btn-full { width: 100%; justify-content: center; }
.btn-sm { padding: 3px 8px; font-size: 9px; }
.btn-xs { padding: 2px 6px; font-size: 8px; letter-spacing: .3px; }

/* ══════════════════════════════
   MAIN
══════════════════════════════ */
.main {
  margin-left: var(--sbw); flex: 1;
  display: flex; flex-direction: column; min-height: 100vh;
  transition: margin-left .25s;
}
.main.expanded { margin-left: 0; }

/* top bar */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(7,9,13,.96); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex; align-items: center; gap: 10px; height: 50px;
  flex-shrink: 0;
}
.topbar-hamburger {
  display: none; background: none; border: none; cursor: pointer;
  color: var(--tmid); font-size: 18px; padding: 4px; flex-shrink: 0;
}
.topbar-breadcrumb {
  font-family: var(--display); font-size: 20px; letter-spacing: 2px; color: var(--text);
}
.topbar-breadcrumb .bc-section { color: var(--green); }
.topbar-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.section-badge {
  font-size: 9px; font-family: var(--mono); padding: 2px 7px; border-radius: 4px;
  border: 1px solid var(--border); color: var(--tdim); background: var(--panel);
}

/* content */
.content { flex: 1; padding: 20px 28px 80px; max-width: 900px; width: 100%; }

/* ══════════════════════════════
   SECTION VIEW
══════════════════════════════ */
.section-view { display: none; animation: fadeSlide .25s ease; }
.section-view.active { display: block; }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.sec-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--rl) var(--rl) 0 0;
  margin-bottom: 0;
}
.sec-icon { font-size: 18px; flex-shrink: 0; }
.sec-title-wrap { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.sec-name-display {
  font-family: var(--display); font-size: 20px; letter-spacing: 2px; color: var(--text);
}
.sec-count { font-size: 9px; font-family: var(--mono); color: var(--tdim); background: var(--bg); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
.sec-actions { display: flex; gap: 4px; flex-shrink: 0; }

/* ══════════════════════════════
   COMMAND LIST (SINGLE COLUMN)
══════════════════════════════ */
.cmd-list {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-top: none;
}

.cmd-card {
  border-bottom: 1px solid var(--border);
  transition: background .15s;
  position: relative;
}
.cmd-card:last-child { border-bottom: none; }
.cmd-card:hover { background: rgba(255,255,255,.012); }

.cmd-card-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px 5px;
}
.cmd-title {
  font-size: 11px; font-weight: 600; color: var(--yellow);
  flex: 1; outline: none; background: transparent; border: none;
  cursor: text; font-family: var(--sans); min-width: 0;
}
.cmd-title:focus { color: var(--green); border-bottom: 1px dashed var(--green); }
.cmd-btns { display: flex; gap: 3px; flex-shrink: 0; }

.cmd-preview {
  margin: 0 16px 5px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 12px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: #a8cfe8;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.75;
}
.cmd-preview.multi { border-left: 2px solid rgba(0,229,160,.3); }

.cmd-edit-wrap { display: none; margin: 0 16px 8px; flex-direction: column; gap: 5px; }
.cmd-edit-wrap.open { display: flex; }
.cmd-edit-wrap textarea {
  background: var(--bg); border: 1px solid var(--green);
  border-radius: 6px; padding: 9px 12px;
  font-family: var(--mono); font-size: 10.5px; color: var(--text);
  resize: vertical; min-height: 70px; outline: none; line-height: 1.75;
}
.cmd-edit-footer { display: flex; gap: 5px; }
.cmd-tag { font-size: 8px; padding: 1px 5px; border-radius: 3px; font-family: var(--mono); letter-spacing: .3px; }
.tag-shell { background: rgba(255,77,109,.15); color: var(--red); }
.tag-enum  { background: rgba(77,166,255,.15); color: var(--blue); }
.tag-hash  { background: rgba(192,132,252,.15); color: var(--purple); }
.tag-pivot { background: rgba(34,211,238,.15); color: var(--cyan); }

/* section footer */
.sec-footer {
  padding: 10px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-top: 1px solid var(--border);
  border-radius: 0 0 var(--rl) var(--rl);
  display: flex; gap: 6px;
}

/* empty */
.empty-state {
  padding: 28px; text-align: center;
  color: var(--tdim); font-size: 12px; font-family: var(--sans); line-height: 1.8;
}
.empty-state span { display: block; font-size: 28px; margin-bottom: 6px; }

/* empty section (no section selected) */
.no-section {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 60vh; color: var(--tdim);
  font-family: var(--sans); text-align: center; gap: 10px;
}
.no-section .big { font-family: var(--display); font-size: 40px; letter-spacing: 4px; color: var(--border2); }
.no-section p { font-size: 12px; max-width: 300px; line-height: 1.7; }

/* ══════════════════════════════
   TOAST
══════════════════════════════ */
#toast {
  position: fixed; bottom: 22px; right: 22px; z-index: 9999;
  background: var(--card); border: 1px solid var(--border2); border-left: 3px solid var(--green);
  border-radius: var(--r); padding: 9px 16px;
  font-size: 11px; font-family: var(--sans); color: var(--text);
  opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateY(0); }

/* ══════════════════════════════
   MODAL
══════════════════════════════ */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.72); z-index: 2000;
  align-items: center; justify-content: center; backdrop-filter: blur(4px);
}
.modal-bg.open { display: flex; }
.modal-box {
  background: var(--panel); border: 1px solid var(--border2);
  border-radius: var(--rl); padding: 22px 24px; width: 430px; max-width: 92vw;
  animation: fadeSlide .2s ease;
}
.modal-box h3 { font-family: var(--display); font-size: 22px; letter-spacing: 2px; color: var(--text); margin-bottom: 16px; }
.modal-box label { display: block; font-size: 9px; letter-spacing: 1.5px; color: var(--blue); text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
.modal-box input, .modal-box textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px; color: var(--text);
  font-family: var(--mono); font-size: 11px; outline: none; margin-bottom: 12px; transition: border-color .15s;
}
.modal-box input:focus, .modal-box textarea:focus { border-color: var(--green); }
.modal-box textarea { min-height: 90px; resize: vertical; line-height: 1.65; }
.modal-actions { display: flex; gap: 6px; justify-content: flex-end; }

/* ══════════════════════════════
   MOBILE / RESPONSIVE
══════════════════════════════ */
.mob-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.55); z-index: 150;
  backdrop-filter: blur(2px);
}
.mob-overlay.show { display: block; }

@media (max-width: 800px) {
  :root { --sbw: 270px; }
  .topbar-hamburger { display: flex; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.mob-open { transform: translateX(0); }
  .main { margin-left: 0 !important; }
  .content { padding: 14px 14px 60px; }
  .topbar { padding: 0 14px; }
  .cmd-preview { font-size: 9.5px; }
}
</style>
</head>
<body>

<div id="toast"></div>

<!-- MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal-box" id="modal-inner"></div>
</div>

<!-- MOBILE OVERLAY -->
<div class="mob-overlay" id="mobOverlay" onclick="closeSidebar()"></div>

<!-- ══════ SIDEBAR ══════ -->

    <div class="sb-logo">OSCP+</div>

  </div>
</aside>

<!-- ══════ MAIN ══════ -->
<div class="main" id="main">

  <!-- TOP BAR -->
  <div class="topbar" id="topbar">

      <span class="bc-section" id="bcSection"></span>
    </div>
    <div class="topbar-right">
      <span class="section-badge" id="topBadge" style="display:none"></span>
      <button class="btn btn-sm btn-green" style="display:none" id="topAddCmd" onclick="openAddCmd(currentSection)">＋ Command</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="content">

    <!-- NO SECTION SELECTED -->
    <div class="no-section" id="noSection">
      <div class="big">SELECT</div>
      <p>Choose a section from the sidebar to view and edit its commands.</p>
      <button class="btn btn-green" style="margin-top:8px" onclick="openAddSection()">＋ Add Section</button>
    </div>

    <!-- SECTION VIEWS (injected by JS) -->
    <div id="sectionViews"></div>

  </div>
</div>

/* ══════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════ */
let S = { sections:[], vars:{...DEF_VARS} };
let currentSection = null;
let saveTimer = null;

/* ══════════════════════════════════════════════════
   LOAD / SAVE
══════════════════════════════════════════════════ */
function loadS() {
  try {
    const raw = localStorage.getItem(SK);
    if (raw) {
      const d = JSON.parse(raw);
      S.sections = d.sections || JSON.parse(JSON.stringify(DEF_DATA));
      S.vars = { ...DEF_VARS, ...(d.vars || {}) };
    } else {
      S.sections = JSON.parse(JSON.stringify(DEF_DATA));
    }
  } catch(e) {
    S.sections = JSON.parse(JSON.stringify(DEF_DATA));
  }
}

function saveS() {
  try {
    localStorage.setItem(SK, JSON.stringify(S));
    setSaveState(true);
  } catch(e) {}
}

function scheduleSave() {
  setSaveState(false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveS, 500);
}

function setSaveState(saved) {
  const dot = document.getElementById('saveDot');
  const lbl = document.getElementById('saveLbl');
  if (dot) dot.classList.toggle('on', saved);
  if (lbl) lbl.textContent = saved ? 'SAVED' : 'SAVING...';
}

/* ══════════════════════════════════════════════════
   VARS
══════════════════════════════════════════════════ */
const VAR_KEYS = ['TARGET','DC_IP','LHOST','LPORT','DOMAIN','DOMAIN_USER','PASS','NTLM'];

function getV() {
  const v = {};
  VAR_KEYS.forEach(k => { v[k] = document.getElementById('V_'+k)?.value || S.vars[k] || ''; });
  return v;
}

function inject(cmd) {
  const v = getV();
  return cmd
    .replace(/\{TARGET\}/g, v.TARGET)
    .replace(/\{DC_IP\}/g, v.DC_IP)
    .replace(/\{LHOST\}/g, v.LHOST)
    .replace(/\{LPORT\}/g, v.LPORT)
    .replace(/\{DOMAIN\}/g, v.DOMAIN)
    .replace(/\{DOMAIN_USER\}/g, v.DOMAIN_USER)
    .replace(/\{PASS\}/g, v.PASS)
    .replace(/\{NTLM\}/g, v.NTLM);
}

function onVC() {
  S.vars = getV();
  // Refresh all visible previews
  document.querySelectorAll('.cmd-preview[data-raw]').forEach(el => {
    el.textContent = inject(el.getAttribute('data-raw'));
  });
  scheduleSave();
}

function resetVars() {
  VAR_KEYS.forEach(k => {
    const el = document.getElementById('V_'+k);
    if (el) el.value = DEF_VARS[k];
  });
  S.vars = {...DEF_VARS};
  onVC();
}

/* ══════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════ */
let toastT;
function toast(msg, dur = 1800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), dur);
}

/* ══════════════════════════════════════════════════
   UID
══════════════════════════════════════════════════ */
function uid() { return 'x' + Math.random().toString(36).slice(2,9); }

/* ══════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════ */
function render() {
  renderNav();
  renderViews();
  setActive(currentSection);
}

/* ── SIDEBAR NAV ── */
function renderNav() {
  const nav = document.getElementById('sbNav');
  nav.innerHTML = '<div class="sb-nav-lbl">Sections</div>';
  S.sections.forEach(sec => {
    const el = document.createElement('div');
    el.className = 'nav-item' + (currentSection === sec.id ? ' active' : '');
    el.setAttribute('data-sid', sec.id);
    el.innerHTML = `
      <span class="ni-icon">${esc(sec.icon||'')}</span>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sec.name)}</span>
      <span class="ni-count">${sec.commands.length}</span>
    `;
    el.onclick = () => { selectSection(sec.id); };
    nav.appendChild(el);
  });
}

/* ── SECTION VIEWS ── */
function renderViews() {
  const container = document.getElementById('sectionViews');
  container.innerHTML = '';
  S.sections.forEach(sec => {
    container.appendChild(buildView(sec));
  });
}

function buildView(sec) {
  const div = document.createElement('div');
  div.className = 'section-view' + (currentSection === sec.id ? ' active' : '');
  div.id = 'sv_' + sec.id;
  div.setAttribute('data-sid', sec.id);

  const cmdsHtml = sec.commands.length === 0
    ? `<div class="empty-state"><span>📋</span>No commands yet.<br>Click "＋ Add Command" to get started.</div>`
    : sec.commands.map(c => buildCard(c)).join('');

  div.innerHTML = `
    <div class="sec-header">
      <span class="sec-icon">${esc(sec.icon||'')}</span>
      <div class="sec-title-wrap">
        <span class="sec-name-display">${esc(sec.name)}</span>
        <span class="sec-count">${sec.commands.length} cmd${sec.commands.length!==1?'s':''}</span>
      </div>
      <div class="sec-actions">
        <button class="btn btn-sm btn-yellow" onclick="openRenameSection('${sec.id}')">✏️ Rename</button>
        <button class="btn btn-sm btn-red" onclick="confirmDelSection('${sec.id}')">🗑️ Delete</button>
      </div>
    </div>
    <div class="cmd-list" id="cl_${sec.id}">
      ${cmdsHtml}
    </div>
    <div class="sec-footer">
      <button class="btn btn-green btn-sm" onclick="openAddCmd('${sec.id}')">➕ Add Command</button>
    </div>
  `;
  return div;
}

function buildCard(cmd) {
  const isMulti = cmd.cmd.includes('\n');
  const raw = cmd.cmd;
  const previewed = inject(raw);
  const enc = encodeURIComponent(raw); // safe storage in data-raw

  return `
    <div class="cmd-card" id="cmd_${cmd.id}">
      <div class="cmd-card-head">
        <span class="cmd-title" contenteditable="true" spellcheck="false"
          onblur="onTitleBlur(this,'${cmd.id}')"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
        >${esc(cmd.title)}</span>
        <div class="cmd-btns">
          <button class="btn btn-xs btn-blue" onclick="copyCmd('${cmd.id}')">📋 Copy</button>
          <button class="btn btn-xs" onclick="toggleEdit('${cmd.id}')">✏️ Edit</button>
          <button class="btn btn-xs btn-red" onclick="confirmDelCmd('${cmd.id}')">❌</button>
        </div>
      </div>
      <pre class="cmd-preview${isMulti?' multi':''}" data-raw="${esc(raw)}">${esc(previewed)}</pre>
      <div class="cmd-edit-wrap" id="ew_${cmd.id}">
        <textarea id="eta_${cmd.id}">${esc(raw)}</textarea>
        <div class="cmd-edit-footer">
          <button class="btn btn-xs btn-green" onclick="saveEdit('${cmd.id}')">✓ Save</button>
          <button class="btn btn-xs" onclick="toggleEdit('${cmd.id}')">✕ Cancel</button>
        </div>
      </div>
    </div>
  `;
}

/* ══════════════════════════════════════════════════
   SECTION SELECTION (SINGLE VIEW)
══════════════════════════════════════════════════ */
function selectSection(sid) {
  currentSection = sid;
  // Hide no-section
  document.getElementById('noSection').style.display = 'none';
  // Show correct view, hide others
  document.querySelectorAll('.section-view').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-sid') === sid);
  });
  // Update nav
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-sid') === sid);
  });
  // Update top bar
  const sec = S.sections.find(s => s.id === sid);
  if (sec) {
    document.getElementById('bcSep').style.display = '';
    document.getElementById('bcSection').textContent = sec.icon + ' ' + sec.name;
    const badge = document.getElementById('topBadge');
    badge.textContent = sec.commands.length + ' commands';
    badge.style.display = '';
    const addBtn = document.getElementById('topAddCmd');
    addBtn.style.display = '';
    addBtn.onclick = () => openAddCmd(sid);
  }
  // Close sidebar on mobile
  if (window.innerWidth <= 800) closeSidebar();
}

function setActive(sid) {
  if (!sid) return;
  selectSection(sid);
}

/* ══════════════════════════════════════════════════
   SECTION OPERATIONS
══════════════════════════════════════════════════ */
function openAddSection() {
  openModal('ADD SECTION', `
    <label>Section Name</label>
    <input id="mi_name" placeholder="e.g. 🔐 POST EXPLOITATION" autofocus>
    <label>Emoji Icon</label>
    <input id="mi_icon" placeholder="🔐" style="width:80px">
  `, [
    { label:'＋ Add', cls:'btn-green', fn:() => {
      const name = document.getElementById('mi_name')?.value.trim();
      const icon = document.getElementById('mi_icon')?.value.trim() || '📋';
      if (!name) { toast('⚠ Enter a section name'); return; }
      const id = uid();
      S.sections.push({ id, icon, name, commands:[] });
      currentSection = id;
      render();
      scheduleSave();
      toast(`"${name}" section added`);
      closeModal();
      setTimeout(() => selectSection(id), 50);
    }},
    { label:'Cancel', cls:'', fn: closeModal }
  ]);
  setTimeout(() => document.getElementById('mi_name')?.focus(), 60);
}

function openRenameSection(sid) {
  const sec = S.sections.find(s => s.id === sid);
  if (!sec) return;
  openModal('RENAME SECTION', `
    <label>Section Name</label>
    <input id="mi_rename" value="${esc(sec.name)}" autofocus>
    <label>Icon</label>
    <input id="mi_icon2" value="${esc(sec.icon||'')}" style="width:80px">
  `, [
    { label:'✓ Save', cls:'btn-green', fn:() => {
      const name = document.getElementById('mi_rename')?.value.trim();
      const icon = document.getElementById('mi_icon2')?.value.trim() || sec.icon || '📋';
      if (!name) { toast('⚠ Enter a name'); return; }
      sec.name = name; sec.icon = icon;
      render();
      scheduleSave();
      toast('Section renamed');
      closeModal();
    }},
    { label:'Cancel', cls:'', fn: closeModal }
  ]);
  setTimeout(() => document.getElementById('mi_rename')?.focus(), 60);
}

function confirmDelSection(sid) {
  const sec = S.sections.find(s => s.id === sid);
  if (!sec) return;
  openModal('DELETE SECTION', `
    <p style="color:var(--tmid);font-size:12px;margin-bottom:16px">
      Delete <strong style="color:var(--text)">${esc(sec.name)}</strong> and all ${sec.commands.length} command${sec.commands.length!==1?'s':''}? This cannot be undone.
    </p>
  `, [
    { label:'🗑️ Delete', cls:'btn-red', fn:() => {
      S.sections = S.sections.filter(s => s.id !== sid);
      if (currentSection === sid) {
        currentSection = S.sections[0]?.id || null;
      }
      render();
      if (!currentSection) {
        document.getElementById('noSection').style.display = '';
        document.getElementById('bcSep').style.display = 'none';
        document.getElementById('bcSection').textContent = '';
        document.getElementById('topBadge').style.display = 'none';
        document.getElementById('topAddCmd').style.display = 'none';
      }
      scheduleSave();
      toast('Section deleted');
      closeModal();
    }},
    { label:'Cancel', cls:'', fn: closeModal }
  ]);
}

/* ══════════════════════════════════════════════════
   COMMAND OPERATIONS
══════════════════════════════════════════════════ */
function findCmd(cid) {
  for (const sec of S.sections) {
    const cmd = sec.commands.find(c => c.id === cid);
    if (cmd) return { sec, cmd };
  }
  return null;
}

function openAddCmd(sid) {
  const sec = S.sections.find(s => s.id === sid);
  if (!sec) return;
  openModal('ADD COMMAND', `
    <label>Title</label>
    <input id="mi_ct" placeholder="e.g. Nmap Quick Scan" autofocus>
    <label>Command</label>
    <textarea id="mi_cc" rows="4" placeholder="nmap -sV {TARGET}"></textarea>
  `, [
    { label:'＋ Add', cls:'btn-green', fn:() => {
      const title = document.getElementById('mi_ct')?.value.trim();
      const cmdText = document.getElementById('mi_cc')?.value.trim();
      if (!title) { toast('⚠ Enter a title'); return; }
      if (!cmdText) { toast('⚠ Enter a command'); return; }
      const id = uid();
      sec.commands.push({ id, title, cmd: cmdText });
      // Inject into DOM
      const list = document.getElementById('cl_' + sid);
      if (list) {
        // Remove empty state if present
        const emp = list.querySelector('.empty-state');
        if (emp) emp.remove();
        // Append card
        const tmp = document.createElement('div');
        tmp.innerHTML = buildCard({ id, title, cmd: cmdText });
        list.appendChild(tmp.firstElementChild);
      }
      // Update count in header
      const countEl = document.querySelector(`#sv_${sid} .sec-count`);
      if (countEl) countEl.textContent = sec.commands.length + ' cmd' + (sec.commands.length!==1?'s':'');
      updateTopBadge(sid);
      renderNav();
      scheduleSave();
      toast(`"${title}" added`);
      closeModal();
    }},
    { label:'Cancel', cls:'', fn: closeModal }
  ]);
  setTimeout(() => document.getElementById('mi_ct')?.focus(), 60);
}

function onTitleBlur(el, cid) {
  const found = findCmd(cid);
  if (!found) return;
  const newTitle = el.textContent.trim() || 'Untitled';
  if (newTitle !== found.cmd.title) {
    found.cmd.title = newTitle;
    scheduleSave();
  }
}

function toggleEdit(cid) {
  const ew = document.getElementById('ew_' + cid);
  const preview = document.querySelector('#cmd_' + cid + ' .cmd-preview');
  if (!ew) return;
  const opening = !ew.classList.contains('open');
  ew.classList.toggle('open', opening);
  if (preview) preview.style.display = opening ? 'none' : '';
  if (opening) document.getElementById('eta_' + cid)?.focus();
}

function saveEdit(cid) {
  const found = findCmd(cid);
  if (!found) return;
  const ta = document.getElementById('eta_' + cid);
  if (!ta) return;
  const newCmd = ta.value;
  found.cmd.cmd = newCmd;
  // Update preview
  const preview = document.querySelector('#cmd_' + cid + ' .cmd-preview');
  if (preview) {
    preview.setAttribute('data-raw', esc(newCmd));
    preview.textContent = inject(newCmd);
    const isMulti = newCmd.includes('\n');
    preview.classList.toggle('multi', isMulti);
    preview.style.display = '';
  }
  toggleEdit(cid);
  scheduleSave();
  toast('Command saved');
}

function copyCmd(cid) {
  const found = findCmd(cid);
  if (!found) return;
  const text = inject(found.cmd.cmd);
  navigator.clipboard.writeText(text).then(() => {
    toast('📋 Copied to clipboard');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('📋 Copied');
  });
}

function confirmDelCmd(cid) {
  const found = findCmd(cid);
  if (!found) return;
  openModal('DELETE COMMAND', `
    <p style="color:var(--tmid);font-size:12px;margin-bottom:16px">
      Delete <strong style="color:var(--text)">${esc(found.cmd.title)}</strong>?
    </p>
  `, [
    { label:'❌ Delete', cls:'btn-red', fn:() => {
      const sid = found.sec.id;
      found.sec.commands = found.sec.commands.filter(c => c.id !== cid);
      // Remove from DOM
      document.getElementById('cmd_' + cid)?.remove();
      // Show empty state if needed
      const list = document.getElementById('cl_' + sid);
      if (list && found.sec.commands.length === 0) {
        list.innerHTML = `<div class="empty-state"><span>📋</span>No commands yet.<br>Click "➕ Add Command" to get started.</div>`;
      }
      const countEl = document.querySelector(`#sv_${sid} .sec-count`);
      if (countEl) countEl.textContent = found.sec.commands.length + ' cmd' + (found.sec.commands.length!==1?'s':'');
      updateTopBadge(sid);
      renderNav();
      scheduleSave();
      toast('Command deleted');
      closeModal();
    }},
    { label:'Cancel', cls:'', fn: closeModal }
  ]);
}

function updateTopBadge(sid) {
  if (currentSection !== sid) return;
  const sec = S.sections.find(s => s.id === sid);
  if (!sec) return;
  const badge = document.getElementById('topBadge');
  if (badge) badge.textContent = sec.commands.length + ' commands';
}

/* ══════════════════════════════════════════════════
   ESCAPE HELPER
══════════════════════════════════════════════════ */
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ══════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════ */
const _modalActions = {};

function openModal(title, bodyHtml, actions) {
  const inner = document.getElementById('modal-inner');
  const btns = actions.map(a => {
    const k = uid();
    _modalActions[k] = a.fn;
    return `<button class="btn ${a.cls||''}" onclick="_modalActions['${k}']()">${a.label}</button>`;
  }).join('');
  inner.innerHTML = `<h3>${esc(title)}</h3>${bodyHtml}<div class="modal-actions">${btns}</div>`;
  document.getElementById('modal').classList.add('open');
  inner.onkeydown = e => {
    if (e.key === 'Enter' && !e.target.matches('textarea')) {
      const gb = inner.querySelector('.btn-green');
      if (gb) gb.click();
    }
  };
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* ══════════════════════════════════════════════════
   MOBILE SIDEBAR
══════════════════════════════════════════════════ */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('mobOverlay');
  sb.classList.toggle('mob-open');
  ov.classList.toggle('show', sb.classList.contains('mob-open'));
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('mob-open');
  document.getElementById('mobOverlay').classList.remove('show');
}

/* ══════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
══════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.ctrlKey||e.metaKey) && e.key === 'n') { e.preventDefault(); openAddSection(); }
  if ((e.ctrlKey||e.metaKey) && e.key === 'e') { e.preventDefault(); doExport(); }
});

/* ══════════════════════════════════════════════════
   EXPORT
══════════════════════════════════════════════════ */
function doExport() {
  const v = getV();
  const sec_json = JSON.stringify(S.sections);
  const var_json = JSON.stringify(v);

  const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OSCP+ Cheat Sheet Export</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090d;--bg2:#0c0f16;--panel:#111520;--card:#161b28;--border:#1e2638;--border2:#2a3550;--green:#00e5a0;--green-glow:rgba(0,229,160,.14);--blue:#4da6ff;--red:#ff4d6d;--yellow:#ffd166;--text:#dce6f2;--tmid:#7a8fa8;--tdim:#3b4f66;--mono:'JetBrains Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--display:'Bebas Neue',sans-serif;--sbw:260px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;display:flex;min-height:100vh;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border2);}
.sidebar{position:fixed;top:0;left:0;width:var(--sbw);height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:200;}
.sb-head{padding:18px 16px 14px;border-bottom:1px solid var(--border);}
.sb-logo{font-family:var(--display);font-size:30px;letter-spacing:3px;color:var(--green);text-shadow:0 0 22px rgba(0,229,160,.45);}
.sb-sub{font-size:8px;letter-spacing:2px;color:var(--tdim);margin-top:2px;text-transform:uppercase;}
.sb-vars{padding:10px 12px 12px;border-bottom:1px solid var(--border);}
.sb-vars-lbl{font-size:8px;letter-spacing:2px;color:var(--tdim);text-transform:uppercase;margin-bottom:7px;}
.vrow{display:flex;align-items:center;gap:5px;margin-bottom:4px;}
.vrow label{font-size:8px;letter-spacing:1px;color:var(--blue);font-family:var(--mono);width:58px;flex-shrink:0;text-transform:uppercase;}
.vrow input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:3px 6px;color:var(--green);font-family:var(--mono);font-size:9px;outline:none;}
.vrow input:focus{border-color:var(--green);}
.sb-var-btns{display:flex;gap:4px;margin-top:8px;}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0 10px;}
.sb-nav-lbl{font-size:8px;letter-spacing:2px;color:var(--tdim);text-transform:uppercase;padding:6px 16px 3px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;cursor:pointer;font-size:11px;color:var(--tmid);border-left:2px solid transparent;transition:all .15s;}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.03);border-left-color:var(--border2);}
.nav-item.active{color:var(--green);background:var(--green-glow);border-left-color:var(--green);}
.ni-count{margin-left:auto;font-size:9px;font-family:var(--mono);background:var(--panel);padding:1px 5px;border-radius:3px;color:var(--tdim);}
.main{margin-left:var(--sbw);flex:1;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:100;background:rgba(7,9,13,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;height:50px;}
.bc{font-family:var(--display);font-size:20px;letter-spacing:2px;color:var(--text);}
.bc-s{color:var(--green);}
.content{flex:1;padding:20px 28px 80px;max-width:900px;width:100%;}
.sv{display:none;}
.sv.active{display:block;}
.sec-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px 12px 0 0;}
.sec-icon{font-size:18px;}
.sec-name-d{font-family:var(--display);font-size:20px;letter-spacing:2px;color:var(--text);flex:1;}
.sec-count{font-size:9px;font-family:var(--mono);color:var(--tdim);background:var(--bg);padding:2px 6px;border-radius:4px;border:1px solid var(--border);}
.cmd-list{background:var(--bg2);border:1px solid var(--border);border-top:none;}
.cmd-card{border-bottom:1px solid var(--border);}
.cmd-card:last-child{border-bottom:none;}
.cmd-card:hover{background:rgba(255,255,255,.012);}
.cmd-card-head{display:flex;align-items:center;gap:8px;padding:10px 16px 5px;}
.cmd-title-d{font-size:11px;font-weight:600;color:var(--yellow);flex:1;}
.copy-btn{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:9px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--blue);font-family:var(--sans);}
.copy-btn:hover{background:rgba(77,166,255,.1);}
.copy-btn.ok{color:var(--green);border-color:var(--green);}
.cmd-preview{margin:0 16px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-family:var(--mono);font-size:10.5px;color:#a8cfe8;white-space:pre-wrap;word-break:break-all;line-height:1.75;}
.cmd-preview.multi{border-left:2px solid rgba(0,229,160,.3);}
.no-section{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--tdim);font-family:var(--sans);text-align:center;gap:10px;}
.no-section .big{font-family:var(--display);font-size:40px;letter-spacing:4px;color:var(--border2);}
#toast{position:fixed;bottom:22px;right:22px;z-index:9999;background:var(--card);border:1px solid var(--border2);border-left:3px solid var(--green);border-radius:8px;padding:9px 16px;font-size:11px;color:var(--text);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none;}
#toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div id="toast"></div>
<aside class="sidebar">
  <div class="sb-head"><div class="sb-logo">OSCP+</div><div class="sb-sub">Cheat Sheet Export</div></div>
  <div class="sb-vars">
    <div class="sb-vars-lbl">Variables</div>
    <div class="vrow"><label>TARGET</label><input id="V_TARGET" oninput="onVC()"></div>
    <div class="vrow"><label>DC IP</label><input id="V_DC_IP" oninput="onVC()"></div>
    <div class="vrow"><label>LHOST</label><input id="V_LHOST" oninput="onVC()"></div>
    <div class="vrow"><label>LPORT</label><input id="V_LPORT" oninput="onVC()"></div>
    <div class="vrow"><label>DOMAIN</label><input id="V_DOMAIN" oninput="onVC()"></div>
    <div class="vrow"><label>USER</label><input id="V_DOMAIN_USER" oninput="onVC()"></div>
    <div class="vrow"><label>PASS</label><input id="V_PASS" oninput="onVC()"></div>
    <div class="vrow"><label>NTLM</label><input id="V_NTLM" oninput="onVC()"></div>
    <div class="sb-var-btns"><button class="copy-btn" onclick="resetV()">↺ Reset</button></div>
  </div>
  <nav class="sb-nav" id="eNav"><div class="sb-nav-lbl">Sections</div></nav>
</aside>
<div class="main">
  <div class="topbar">
    <div class="bc">OSCP+ <span id="eBcSep" style="color:var(--tdim);margin:0 6px;display:none">›</span><span class="bc-s" id="eBcS"></span></div>
  </div>
  <div class="content" id="eContent">
    <div class="no-section" id="eNo"><div class="big">SELECT</div><p>Choose a section from the sidebar.</p></div>
  </div>
</div>
<script>
var SECS=${sec_json};
var VARS=${var_json};
var VK=['TARGET','DC_IP','LHOST','LPORT','DOMAIN','DOMAIN_USER','PASS','NTLM'];
var cur=null;
function gv(){var v={};VK.forEach(k=>{v[k]=document.getElementById('V_'+k)?.value||'';});return v;}
function inj(s){var v=gv();return s.replace(/\\{TARGET\\}/g,v.TARGET).replace(/\\{DC_IP\\}/g,v.DC_IP).replace(/\\{LHOST\\}/g,v.LHOST).replace(/\\{LPORT\\}/g,v.LPORT).replace(/\\{DOMAIN\\}/g,v.DOMAIN).replace(/\\{DOMAIN_USER\\}/g,v.DOMAIN_USER).replace(/\\{PASS\\}/g,v.PASS).replace(/\\{NTLM\\}/g,v.NTLM);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function onVC(){document.querySelectorAll('.cmd-preview[data-raw]').forEach(el=>{el.textContent=inj(decodeURIComponent(el.getAttribute('data-raw')));});}
function resetV(){Object.entries(VARS).forEach(([k,v])=>{var el=document.getElementById('V_'+k);if(el)el.value=v;});onVC();}
var toastT;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
function copyC(enc,btn){var t=inj(decodeURIComponent(enc));navigator.clipboard.writeText(t).then(()=>{btn.classList.add('ok');btn.textContent='✓ Copied';setTimeout(()=>{btn.classList.remove('ok');btn.textContent='📋 Copy';},1500);toast('📋 Copied');});}
function sel(sid){
  cur=sid;
  document.getElementById('eNo').style.display='none';
  document.querySelectorAll('.sv').forEach(el=>el.classList.toggle('active',el.dataset.sid===sid));
  document.querySelectorAll('#eNav .nav-item').forEach(el=>el.classList.toggle('active',el.dataset.sid===sid));
  var sec=SECS.find(s=>s.id===sid);
  if(sec){document.getElementById('eBcSep').style.display='';document.getElementById('eBcS').textContent=(sec.icon||'')+' '+sec.name;}
}
function render(){
  var nav=document.getElementById('eNav');
  nav.innerHTML='<div class="sb-nav-lbl">Sections</div>';
  var content=document.getElementById('eContent');
  var noSec=document.getElementById('eNo');
  SECS.forEach(sec=>{
    var ni=document.createElement('div');ni.className='nav-item';ni.dataset.sid=sec.id;
    ni.innerHTML=esc(sec.icon||'')+' '+esc(sec.name)+'<span class="ni-count">'+sec.commands.length+'</span>';
    ni.onclick=()=>sel(sec.id);nav.appendChild(ni);
    var sv=document.createElement('div');sv.className='sv';sv.dataset.sid=sec.id;sv.id='esv_'+sec.id;
    var cmds=sec.commands.length===0?'<div style="padding:24px;text-align:center;color:var(--tdim)">No commands</div>':sec.commands.map(c=>{
      var enc=encodeURIComponent(c.cmd);
      return '<div class="cmd-card"><div class="cmd-card-head"><span class="cmd-title-d">'+esc(c.title)+'</span><button class="copy-btn" onclick="copyC(\\''+enc+'\\',this)">📋 Copy</button></div><pre class="cmd-preview'+(c.cmd.includes('\\n')?' multi':'')+'" data-raw="'+enc+'">'+esc(inj(c.cmd))+'</pre></div>';
    }).join('');
    sv.innerHTML='<div class="sec-header"><span class="sec-icon">'+esc(sec.icon||'')+'</span><span class="sec-name-d">'+esc(sec.name)+'</span><span class="sec-count">'+sec.commands.length+' cmds</span></div><div class="cmd-list">'+cmds+'</div>';
    content.appendChild(sv);
  });
  Object.entries(VARS).forEach(([k,v])=>{var el=document.getElementById('V_'+k);if(el)el.value=v;});
  if(SECS.length>0)sel(SECS[0].id);
}
render();
<\/script>
</body>
</html>`;

  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'oscp_export_' + new Date().toISOString().slice(0,10) + '.html';
  a.click();
  URL.revokeObjectURL(url);
  toast('⬇ Export downloaded');
}

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
function init() {
  loadS();
  // Set var inputs from saved state
  VAR_KEYS.forEach(k => {
    const el = document.getElementById('V_' + k);
    if (el) el.value = S.vars[k] || DEF_VARS[k];
  });
  render();
  // Auto-select first section
  if (S.sections.length > 0) {
    selectSection(S.sections[0].id);
  }
  setSaveState(true);
}

init();
</script>
</body>
</html>
